[export]
include = [
    "WezTermHandle",
    "WezTermSize",
    "WezTermCursorInfo",
    "WezTermCellInfo",
    "WezTermLineInfo",
    "WezTermColorRGBA",
    "WezTermCursorShape",
    "WezTermIntensity",
    "WezTermUnderline",
    "WezTermCallbacks",
    "WezTermConfig",
    "WezTermKeyCode",
    "WezTermKeyModifiers",
    "WezTermMouseButton",
    "WezTermMouseEventKind",
]

[export.rename]

[enum]
rename_variants = "QualifiedScreamingSnakeCase"

[parse]
parse_deps = false

[fn]
prefix = ""

language = "C"
style = "both"
header = """
/* Generated by cbindgen - do not edit manually */
/* libwezterm C FFI - Terminal emulation from WezTerm */
"""

include_guard = "LIBWEZTERM_H"
